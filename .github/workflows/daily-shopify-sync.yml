name: Sync Shopify vers Snowflake

on:
  schedule:
    # Tous les jours à 6h00 UTC (= 2h00 heure de Montréal en hiver, 3h00 en été)
    # Ajuste l'heure selon tes préférences : https://crontab.guru
    - cron: "0 6 * * *"
  workflow_dispatch: # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      # Identifiants Shopify (utilisés par extract-orders.py / extract-products.py)
      SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      # Identifiants Snowflake (compte de service partagé SVC_DATA_ENG,
      # authentification par clé RSA, rôle cloisonné ROLE_SHOPIFY).
      # Nécessaires aux 3 étapes : les scripts d'extraction lisent aussi le
      # watermark dans Snowflake avant d'appeler l'API Shopify.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ROLE_SHOPIFY
      SNOWFLAKE_SHOPIFY_DATABASE: SHOPIFY
      SNOWFLAKE_SHOPIFY_SCHEMA: PUBLIC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install pandas requests "snowflake-connector-python[pandas]" cryptography

      - name: Extraire les commandes Shopify (incrémental)
        run: python extract-orders.py

      - name: Extraire les produits Shopify (incrémental)
        run: python extract-products.py

      - name: Charger dans Snowflake (MERGE)
        run: python load-shopify-to-snowflake.py